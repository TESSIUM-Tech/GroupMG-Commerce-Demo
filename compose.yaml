name: groupmg-commerce
services:
  gateway:
    image: apache/apisix:3.14.1-debian
    profiles: [app]
    ports: ["127.0.0.1:8080:9080"]
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks: [edge]
    depends_on: [web, api]
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args: { WORKSPACE: "@groupmg/web" }
    profiles: [app]
    networks: [edge]
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args: { WORKSPACE: "@groupmg/api" }
    profiles: [app]
    networks: [edge, data]
    environment: { PORT: "3001" }
  worker-erp:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args: { WORKSPACE: "@groupmg/worker-erp" }
    profiles: [app]
    networks: [data, integration]
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copiar .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Configurar POSTGRES_DB}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [data]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7.4-bookworm
    command: [redis-server, --appendonly, "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Configurar usuario RabbitMQ}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Configurar clave RabbitMQ}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    networks: [data]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  edge:
  data:
    internal: true
  integration:
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
