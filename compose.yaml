name: groupmg-commerce
services:
  gateway:
    image: apache/apisix:3.14.1-debian
    profiles: [app]
    ports: ["127.0.0.1:8080:9080"]
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks: [edge]
    depends_on: [web, api]
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args: { WORKSPACE: "@groupmg/web" }
    profiles: [app]
    networks: [edge]
    environment:
      INTERNAL_API_URL: "http://api:3001"
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args: { WORKSPACE: "@groupmg/api" }
    profiles: [app]
    networks: [edge, data]
    environment:
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Configurar DATABASE_URL_DOCKER}
      # Pagos (DEMO-09): opcionales; sin ellos la API arranca con pagos desactivados.
      PAYMENTS_MODE: ${PAYMENTS_MODE:-disabled}
      PAYMENTS_SIMULATED_OUTCOME: ${PAYMENTS_SIMULATED_OUTCOME:-approved}
      PAYMENTS_CALLBACK_SECRET: ${PAYMENTS_CALLBACK_SECRET:-}
      PAYPHONE_TOKEN: ${PAYPHONE_TOKEN:-}
      PAYPHONE_STORE_ID: ${PAYPHONE_STORE_ID:-}
      PAYPHONE_RESPONSE_URL: ${PAYPHONE_RESPONSE_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
  worker-erp:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args: { WORKSPACE: "@groupmg/worker-erp" }
    profiles: [app]
    networks: [data, integration]
    environment:
      ERP_ADAPTER: simulated
      ERP_BASE_URL: http://erp-simulator:3003
      ERP_TIMEOUT_MS: ${ERP_TIMEOUT_MS:-3000}
      ERP_PAGE_SIZE: ${ERP_PAGE_SIZE:-20}
    depends_on:
      erp-simulator: { condition: service_healthy }
  erp-simulator:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args: { WORKSPACE: "@groupmg/erp-simulator" }
    profiles: [app, erp-demo]
    networks: [integration, erp-data]
    environment:
      ERP_DATABASE_URL: postgresql://erp_demo:${ERP_POSTGRES_PASSWORD:-erp-local-change-me}@erp-postgres:5432/erp_demo
      ERP_ENV: ${ERP_ENV:-demo}
      ERP_PORT: "3003"
      ERP_DEMO_SCENARIO: ${ERP_DEMO_SCENARIO:-normal}
      ERP_DEMO_LATENCY_MS: ${ERP_DEMO_LATENCY_MS:-0}
      ERP_DEMO_TIMEOUT_MS: ${ERP_DEMO_TIMEOUT_MS:-10000}
    depends_on:
      erp-postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  erp-postgres:
    image: postgres:17-bookworm
    profiles: [app, erp-demo]
    networks: [erp-data]
    environment:
      POSTGRES_USER: erp_demo
      POSTGRES_PASSWORD: ${ERP_POSTGRES_PASSWORD:-erp-local-change-me}
      POSTGRES_DB: erp_demo
    volumes: ["erp-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U erp_demo -d erp_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copiar .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Configurar POSTGRES_DB}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [data, local-db]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7.4-bookworm
    command: [redis-server, --appendonly, "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Configurar usuario RabbitMQ}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Configurar clave RabbitMQ}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    networks: [data]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  erp-data:
    internal: true
  edge:
  data:
    internal: true
  integration:
  local-db:
volumes:
  erp-postgres-data:
  postgres-data:
  redis-data:
  rabbitmq-data:
