name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://commerce:ci-demo-only@127.0.0.1:5432/commerce_issue2_test?schema=public
      ALLOW_DEMO_SEED: "true"
      ALLOW_DB_TESTS: "true"
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: ci-demo-only
          POSTGRES_DB: commerce_issue2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce_issue2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4.1-management
        env:
          RABBITMQ_DEFAULT_USER: commerce
          RABBITMQ_DEFAULT_PASS: ci-demo-only
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run db:migrate
      - run: pnpm run test
      - run: pnpm run test:worker
      - name: Messaging tests (RabbitMQ)
        run: pnpm run test:messaging
        env:
          RABBITMQ_URL: amqp://commerce:ci-demo-only@127.0.0.1:5672
          ALLOW_RABBITMQ_TESTS: "true"
      - run: docker compose --env-file .env.example --profile app config --quiet
